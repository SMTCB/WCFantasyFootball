# ── Tier 3 (Local Full-Stack E2E) — TESTING_STRATEGY.md ────────────────────────
# Sections below configure `npx supabase start`, the full local Docker stack
# (Postgres + GoTrue Auth + PostgREST + Realtime + Storage + Edge Runtime + Studio).
# This is distinct from docker-compose.yml's bare `postgres:15-alpine` (Tier 1
# unit tests only) and its single-function `functions` runner — those two paths
# are never meant to run simultaneously with this one; note the port 54321
# overlap between docker-compose's `functions` service (host 54321→container
# 9000) and this stack's [api] port below is intentional and harmless since
# they're mutually exclusive dev paths, not a bug.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match prod's Postgres major version — confirmed via
# `npx supabase db query --linked "SHOW server_version;"` = 17.6.
major_version = 17

[db.migrations]
# Disabled (2026-08-27, Tier 3 Foundation) — a real `supabase db reset` full
# replay was attempted and hard-failed at migration 09/281 on a genuine,
# pre-existing schema-drift bug (a prod fix applied directly, never captured
# as a migration file — same root cause Tier 2's schema-rehearsal job already
# documented and works around by loading supabase/schema.sql instead of
# replaying migrations from scratch; see TESTING_STRATEGY.md's Tier 2
# section). Unknown how many more such breaks exist further down the ~270
# remaining migrations, and fixing them means editing already-applied
# migration files, which CLAUDE.md's append-only rule exists to prevent.
# Tier 3 now bootstraps the local stack's schema the same way Tier 2 does:
# `scripts/e2e-local.mjs` loads schema.sql directly via psql/pg after
# `supabase start`, then loads seed.sql — see that script, not this toggle.
enabled = false

[db.seed]
# Disabled — the CLI's automatic seed-after-migrations hook assumes
# migrations built the schema first, which Tier 3 now bypasses (see
# [db.migrations] above). supabase/seed.sql is applied manually by
# scripts/e2e-local.mjs, after it loads schema.sql, not by this hook.
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Local email testing inbox — signups/password-reset emails are caught here,
# not sent. Not required for Tier-3 specs since auth.email.enable_confirmations
# is false below (real GoTrue sessions issued immediately on signUp).
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Covers both `npm run dev` (5173) and the Playwright webServer preview (5174).
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173", "http://127.0.0.1:5173",
  "http://localhost:5174", "http://127.0.0.1:5174",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
# No confirmation step locally — Tier-3 specs need a usable session
# immediately after signUp(), with no inbox-polling step in the loop.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
# Disabled: the Logflare/BigQuery analytics container isn't needed for E2E
# runs and adds real Docker startup weight for no test value here.
enabled = false

