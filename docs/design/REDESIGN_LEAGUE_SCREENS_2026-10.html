<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Screens Redesign</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3ED;--card:#fff;--raised:#EFEAE2;--rule:#E2DDD5;--ink:#18202E;--ink2:#3F4A5C;--mute:#5C6878;--accent:#1A6FA8;--accent-bg:#E6F0F7;--on-accent:#fff;--gold:#925A0A;--gold-bg:#FAF0DE;--good:#166534;--good-bg:#E3F0E6;--crit:#B91C1C;--crit-bg:#FBE9E9;--navy:#18202E;--on-navy:#F2EEE5;--pitch:#2F7A4B;--pitch2:#2A6E43;--display:'Archivo Black',sans-serif;--sans:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--page:#E9E4DB;color-scheme:light}
:root[data-theme=dark]{--bg:#0B0F14;--card:#141A22;--raised:#1C242E;--rule:#2E3846;--ink:#F2EEE5;--ink2:#C3CAD6;--mute:#93A0B1;--accent:#5FB3E5;--accent-bg:#14283A;--on-accent:#0B0F14;--gold:#E5B45C;--gold-bg:#2C2312;--good:#7FDCA4;--good-bg:#14261C;--crit:#F08B8B;--crit-bg:#2E1616;--navy:#0F151D;--pitch:#1E5233;--pitch2:#1A482D;--page:#05080B;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-weight:500}
.ctl{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.ctl b{font-family:var(--display);font-weight:400;font-size:17px}
.seg{display:flex;gap:2px;background:var(--raised);padding:3px;border-radius:10px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);min-height:36px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{max-width:1100px;margin:18px auto 0;padding:0 16px;font-size:14px;color:var(--ink2)}.note b{color:var(--ink)}
.stage{padding:16px;display:flex;justify-content:center}
.frame{container-type:inline-size;background:var(--bg);border:1px solid var(--rule);border-radius:14px;overflow:hidden;width:100%;max-width:1100px}
.frame.m{max-width:390px}
.why{max-width:1100px;margin:0 auto;padding:4px 16px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.why div{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;font-size:14px;color:var(--ink2)}.why h4{font-size:13px;color:var(--accent);margin-bottom:4px}
/* header */
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--rule)}
.logo{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:8px}.logo i{width:26px;height:26px;border-radius:7px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-style:normal;font-size:13px}
.topnav{display:flex;gap:2px;margin-left:8px}.topnav a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink2);min-height:40px}.topnav a.on{background:var(--accent-bg);color:var(--accent)}
.sp{flex:1}.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-bg);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px}
.chead{background:var(--card);padding:14px 16px 0;display:grid;gap:12px}
.crow{display:flex;gap:12px;align-items:center}
.crest{width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--display);font-size:16px;position:relative;flex:none}.crest::after{content:"";position:absolute;left:-4px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--accent)}
.ctitle{font-family:var(--display);font-size:20px;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--raised);color:var(--ink2);white-space:nowrap}
.chip.g{background:var(--good-bg);color:var(--good)}.chip.a{background:var(--accent-bg);color:var(--accent)}.chip.y{background:var(--gold-bg);color:var(--gold)}.chip.r{background:var(--crit-bg);color:var(--crit)}
.pos{display:flex;gap:18px;margin-left:auto;text-align:right}.pos b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}.pos span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);margin:0 -16px;padding:0 16px}
.tabs a{padding:13px 12px;font-weight:600;font-size:15px;color:var(--mute);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:46px}.tabs a.on{color:var(--ink);border-color:var(--accent)}
.tabs .div{width:1px;background:var(--rule);margin:10px 6px}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--good-bg);color:var(--good);font-size:14px;font-weight:600}.bar .btn{margin-left:auto}
.bar.warn{background:var(--gold-bg);color:var(--gold)}
@container (max-width:700px){.pos,.topnav,.hide-m{display:none!important}.bot{display:flex!important}.g2,.g3{grid-template-columns:1fr!important}.bar{flex-wrap:wrap}}
@container (min-width:701px){.show-m{display:none!important}}
.bot{display:none;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--rule);padding:6px 4px;justify-content:space-around}
.bot a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);padding:4px 10px;min-width:60px;min-height:44px}.bot a.on{color:var(--accent)}
/* shared */
.body{padding:16px;display:grid;gap:14px}
.g2{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px}.cp{padding:16px}
.h2{font-size:17px;font-weight:700}.sub{font-size:14px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--rule)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}.btn.dn{background:var(--crit-bg);color:var(--crit)}
.seg2{display:inline-flex;background:var(--raised);padding:3px;border-radius:10px;gap:2px;max-width:100%;overflow-x:auto}
.seg2 a{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);min-height:36px;white-space:nowrap;display:flex;align-items:center}.seg2 a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px}.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}.kpi span{font-size:13px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);min-height:56px}.row:last-child{border:0}
.pp{margin-left:auto;font-weight:700;text-align:right}
.pos-b{width:34px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.GK{background:#FBF0D4;color:#7A5200}.DEF{background:#DDEBF7;color:#14568A}.MID{background:#E3F0E6;color:#166534}.FWD{background:#FBE1E1;color:#A01919}
:root[data-theme=dark] .GK{background:#33290F;color:#E5B45C}:root[data-theme=dark] .DEF{background:#14283A;color:#5FB3E5}:root[data-theme=dark] .MID{background:#14261C;color:#7FDCA4}:root[data-theme=dark] .FWD{background:#2E1616;color:#F08B8B}
.dot{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2);flex:none}
.me .dot{background:var(--accent);color:var(--on-accent)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th{font-size:12px;font-weight:600;color:var(--mute);text-align:right;padding:8px 12px;border-bottom:1px solid var(--rule)}.tbl td{padding:11px 12px;border-bottom:1px solid var(--rule);text-align:right}.tbl tr:last-child td{border:0}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}.tbl tr.me td{background:var(--accent-bg)}
.up{color:var(--good)}.dn_{color:var(--crit)}
.form{display:inline-flex;gap:3px}.form i{width:8px;height:8px;border-radius:50%;background:var(--rule)}.form i.w{background:var(--good)}.form i.l{background:var(--crit)}
.in{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:0 12px;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--mute);flex:1}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.pill{padding:7px 14px;border-radius:20px;border:1px solid var(--rule);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap;min-height:36px;display:flex;align-items:center;gap:6px}.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* pitch */
.pitch{background:repeating-linear-gradient(0deg,var(--pitch) 0 56px,var(--pitch2) 56px 112px);border-radius:14px;padding:16px 8px;display:grid;gap:22px;position:relative;border:2px solid rgba(255,255,255,.25)}
.line{display:flex;justify-content:space-around}
.tok{display:grid;justify-items:center;gap:3px;width:72px;position:relative}
.shirt{width:42px;height:42px;border-radius:50%;background:#fff;color:#18202E;display:grid;place-items:center;font-weight:700;font-size:13px;border:3px solid transparent;position:relative}
.shirt.cap{border-color:#E5B45C}.shirt.out{border-color:#F08B8B}
.shirt b{position:absolute;right:-6px;top:-6px;background:#E5B45C;color:#18202E;width:18px;height:18px;border-radius:50%;font-size:11px;display:grid;place-items:center}
.tok span{font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px;white-space:nowrap}
.tok em{font-style:normal;font-size:12px;font-weight:700;color:#fff}
.bench{display:flex;gap:8px;overflow-x:auto}.bench .tok{flex:none;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 4px;width:84px}.bench .tok span{background:none;color:var(--ink)}.bench .tok em{color:var(--mute)}
/* market */
.basket{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.quota{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quota div{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mute)}.quota b{display:block;font-size:16px;color:var(--ink)}
.bar2{height:4px;border-radius:3px;background:var(--rule);margin-top:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--accent)}
/* live */
.live{display:inline-flex;gap:6px;align-items:center;color:var(--crit);font-weight:700;font-size:13px}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crit)}
.fx{display:flex;gap:10px;overflow-x:auto}.fx>div{flex:none;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;min-width:150px;font-size:14px}.fx b{font-family:var(--display);font-weight:400;font-size:18px}
.log .row{min-height:52px}.tag{font-family:var(--mono);font-weight:500;font-size:12px;background:var(--raised);padding:2px 6px;border-radius:5px;margin-right:4px}
/* stats */
.chart{height:150px;border-bottom:1px solid var(--rule);border-left:1px solid var(--rule);position:relative}
.bars{display:flex;gap:10px;align-items:flex-end;height:100%;padding:0 10px}.bars i{flex:1;background:var(--accent-bg);border-top:3px solid var(--accent);border-radius:4px 4px 0 0}.bars i.g{background:var(--gold-bg);border-color:var(--gold)}
.hbar{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:8px 0}.hbar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.tpl{display:none}.tpl.on{display:block}
.fld{padding:2px 0}

.cr{width:24px;height:24px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.cr.lg{width:32px;height:32px;padding:3px}
.sh{position:relative}.sh .cr{position:absolute;left:-10px;bottom:-6px;width:24px;height:24px}
.sec{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sec i{width:4px;height:18px;border-radius:2px;background:var(--accent)}.sec h3{font-size:16px;font-weight:700}.sec .sub{margin-left:auto}
.col{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:14px 16px;font-weight:700;font-size:15px}
.lines{width:100%;height:170px;display:block}
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--rule)}.stk i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.rail{display:grid;gap:4px}.rail a{padding:9px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between}.rail a.on{background:var(--accent-bg);color:var(--accent)}
.opt{display:flex;gap:8px;flex-wrap:wrap}.opt .btn{flex:1;min-width:110px}
.ccap{background:var(--raised);border-radius:10px;padding:10px 12px}
.g2>*,.body>*{min-width:0}.kpis{min-width:0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="club" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M16 5a3.5 3.5 0 010 7M18 14.5c2 .6 3.3 2.4 3.5 5.5"/></symbol>
<symbol id="trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0V4zM8 6H4v1a3 3 0 003 3M16 6h4v1a3 3 0 01-3 3M12 14v4M8 21h8M10 18h4"/></symbol>
<symbol id="bets" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9M15 6h5v5"/></symbol>
<symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v2M12 16v2M14.5 9.5c-.6-1-1.6-1.5-2.7-1.5-1.6 0-2.8.9-2.8 2.1 0 3 5.700 1.400 5.700 4.300 0 1.200-1.200 2.100-2.900 2.100-1.200 0-2.300-.6-2.800-1.600"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></symbol>
<symbol id="warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18v.5"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
<symbol id="filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></symbol>
</defs></svg>

<div class="ctl">
  <b>League screens</b>
  <div class="seg" id="tabSeg"></div>
  <div class="seg" id="devSeg"><button aria-pressed="true" data-d="d">Desktop</button><button aria-pressed="false" data-d="m">Mobile</button></div>
  <div class="seg" id="thSeg"><button aria-pressed="true" data-th="light">Light</button><button aria-pressed="false" data-th="dark">Dark</button></div>
</div>
<p class="note" id="note"></p>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="why" id="why"></div>

<script>
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const TABS=['Standings','Squad','Market','Live','Recap','Bets','Stats'];
function shell(active,body,extra=''){
 const tabs=TABS.map((t,i)=>(i===4?'<span class="div"></span>':'')+`<a class="${t===active?'on':''}">${t}</a>`).join('');
 return `<div class="top"><div class="logo"><i>F</i>Frontrow</div><nav class="topnav"><a>${ic('home')}Home</a><a class="on">${ic('club')}Clubhouse</a><a>${ic('trophy')}Trophies</a><a>${ic('bets')}Bets</a><a>${ic('coin')}Coins</a></nav><div class="sp"></div><div class="avatar">ST</div></div>
 <div class="chead"><div class="crow"><div class="crest">CE</div><div><div class="ctitle">Champions Eder 26/27 ${ic('chev')}</div><div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap"><span class="chip">Draft · H2H</span><span class="chip a">Gameweek 3</span></div></div><div class="pos"><div><b class="num">2nd</b><span>Rank</span></div><div><b class="num">187</b><span>Points</span></div><div><b class="num up">−12</b><span>To 1st</span></div></div></div><div class="tabs">${tabs}</div></div>${extra}${body}
 <div class="bot"><a>${ic('home')}Home</a><a class="on">${ic('club')}Clubhouse</a><a>${ic('trophy')}Trophies</a><a>${ic('bets')}Bets</a><a>${ic('coin')}Coins</a></div>`;
}
const win=(btn)=>`<div class="bar">${ic('check')}<span>Transfer window open · closes in <span class="mono">2d 4h</span></span>${btn?'<button class="btn sm">Go to market</button>':''}</div>`;

 Stats:['<b>Stats (content kept).</b> All five sections stay: score progression chart, season totals by position, best single gameweek + captaincy hit rate, manager and player ROI (best/worst toggle), and points left on bench. Restyled as consistent cards with plain section titles, a legend, and printed values.',[['Nothing removed','All five infographics stay, stacked as before.'],['Readable on touch','Values printed on the bars, no hover needed.'],['One currency','€ everywhere (£ and € are mixed today).']]],
 Standings:['<b>Standings.</b> Shown on the previous page (Template A). The H2H fixtures become the “Fixtures” segment here.',[['H2H folded in','No separate H2H tab.']]]

let cur='Squad';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
$('#tabSeg').innerHTML=['Squad','Market','Live','Recap','Bets','Stats'].map(t=>`<button data-t="${t}" aria-pressed="${t===cur}">${t}</button>`).join('');
function show(t){cur=t;$('#frame').innerHTML=S[t]();$$('#tabSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));$('#note').innerHTML=NOTES[t][0];$('#why').innerHTML=NOTES[t][1].map(x=>`<div><h4>${x[0]}</h4>${x[1]}</div>`).join('')}
$$('#tabSeg button').forEach(b=>b.onclick=()=>show(b.dataset.t));
$$('#devSeg button').forEach(b=>b.onclick=()=>{$$('#devSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#frame').classList.toggle('m',b.dataset.d==='m')});
$$('#thSeg button').forEach(b=>b.onclick=()=>{$$('#thSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.documentElement.dataset.theme=b.dataset.th});
show('Squad');
